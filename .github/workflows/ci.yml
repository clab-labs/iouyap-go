name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # GOAMD64=v1 keeps the binary runnable on older CPUs and under emulation.
      - run: CGO_ENABLED=0 GOAMD64=v1 go build -trimpath -ldflags="-s -w" -o iouyap .
      - uses: actions/upload-artifact@v4
        with:
          name: iouyap-${{ matrix.arch }}
          path: iouyap

  e2e:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iouyap-amd64
      - run: chmod +x iouyap
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: srl-labs/containerlab
          ref: main
          path: containerlab
      - uses: actions/setup-go@v5
        with:
          go-version-file: containerlab/go.mod
          cache-dependency-path: containerlab/go.sum
      - name: Build containerlab from main
        working-directory: containerlab
        run: |
          CGO_ENABLED=0 go build -trimpath -o containerlab .
          sudo install -m 0755 containerlab /usr/local/bin/containerlab
          containerlab version
      - name: Install Robot Framework, sshpass and telnet
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass telnet
          pip install robotframework
      - run: docker pull ghcr.io/clab-labs/cisco_iol:17.12.01-noiouyap
      - run: robot --outputdir robot-out tests/iouyap.robot
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-out
          path: robot-out
